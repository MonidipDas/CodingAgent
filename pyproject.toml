[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-coding-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "docker>=7,<8", "scikit-learn>=1.5,<2"]

[project.scripts]
coding-agent = "agent:main"

[tool.setuptools]
py-modules = ["agent"]
